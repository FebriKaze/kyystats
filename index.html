<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KyyStats - Data Analysis & Statistics Insights</title>
    <meta name="description" content="KyyStats adalah platform analisis data dan statistik mendalam mengenai berbagai tren ekonomi, sosial, dan finansial. Temukan insight berharga melalui visualisasi data berkualitas." />
    <meta name="keywords" content="kyystats, analisis data, statistik indonesia, visualisasi data, data analyst portfolio, insight ekonomi, tren finansial" />
    <meta name="author" content="KyyStats" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kyystats.vercel.app/" />
    <meta property="og:title" content="KyyStats - Data Analysis & Statistics Insights" />
    <meta property="og:description" content="Eksplorasi insight mendalam melalui data dan statistik. Analisis tren terkini dengan penyajian data yang modern dan akurat." />
    <meta property="og:image" content="/src/components/img/ky_stat_logo-removebg-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kyystats.vercel.app/" />
    <meta property="twitter:title" content="KyyStats - Data Analysis & Statistics Insights" />
    <meta property="twitter:description" content="Eksplorasi insight mendalam melalui data dan statistik." />
    <meta property="twitter:image" content="/src/components/img/ky_stat_logo-removebg-preview.png" />

    <link rel="icon" type="image/png" href="/src/components/img/ky_stat_logo-removebg-preview.png" />
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
